<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OctoSender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;font-size:11px}
body{
  background:#3b82c4 url("https://i.ibb.co/CpgfXDFs/xp-bliss.jpg") center/cover fixed no-repeat;
  color:#000;
}
body:after{
  content:"";position:fixed;inset:0;background:rgba(35,100,160,.10);
  pointer-events:none;
}
.desktop{min-height:100vh;padding:22px 18px 44px;display:flex;align-items:flex-start;justify-content:center}
.window{
  width:min(980px,100%);
  background:#ece9d8;
  border:1px solid #003c9d;
  border-radius:7px 7px 0 0;
  box-shadow:3px 5px 12px rgba(0,0,0,.45);
  overflow:hidden;
}
.titlebar{
  height:28px;padding:4px 8px 4px 6px;
  display:flex;align-items:center;gap:8px;
  color:#fff;font-weight:bold;font-size:12px;
  text-shadow:1px 1px #24436c;
  background:linear-gradient(#6ba5f5,#2f6bd5 48%,#1746ae);
}
.appicon{
  width:19px;height:19px;border-radius:2px;
  background:#fff;border:1px solid #17408e;
  position:relative;overflow:hidden;
}
.appicon:before,.appicon:after{
  content:"";position:absolute;background:#f36b21;border-radius:50%;
}
.appicon:before{width:8px;height:8px;left:2px;top:2px}
.appicon:after{width:8px;height:8px;right:2px;bottom:2px}
.title{flex:1}
.window-controls{display:none}

.toolbar{
  height:34px;display:flex;align-items:center;gap:3px;
  padding:3px 7px;background:#f5f4ee;
  border-bottom:1px solid #aaa;
}
.tool{
  height:27px;min-width:32px;padding:2px 7px;
  background:linear-gradient(#fff,#deddd6);
  border:1px solid transparent;
  border-radius:2px;font:11px Tahoma;
}
.tool:hover{border-color:#7c9acb;background:#e8f1ff}

.main{padding:12px 10px;background:#ece9d8}
.layout{display:grid;grid-template-columns:280px minmax(300px,1fr) 240px;gap:8px}
@media(max-width:850px){.layout{grid-template-columns:1fr 1fr}}
@media(max-width:590px){.layout{grid-template-columns:1fr}}

.group{
  position:relative;margin:0 0 8px;padding:14px 10px 10px;
  border:1px solid #9b9b9b;background:#f7f6ef;
  box-shadow:inset 1px 1px #fff;
}
.group legend{
  position:absolute;top:-7px;left:8px;padding:0 5px;
  background:#f7f6ef;color:#003b91;font-weight:bold;
}
.field{margin-bottom:10px}
label{display:block;margin-bottom:3px;font-weight:bold}
input,textarea,select{
  width:100%;font:11px Tahoma,Arial,sans-serif;
  border:1px solid #7f7f7f;border-top-color:#404040;border-left-color:#404040;
  background:#fff;padding:5px 6px;border-radius:0;outline:none;
}
input:focus,textarea:focus,select:focus{outline:1px dotted #000;outline-offset:-3px}
textarea{height:165px;resize:vertical}
.small{font-size:10px;color:#555}
.small #spamWarning{font-size:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.check{display:flex;align-items:center;gap:5px;margin:6px 0;font-weight:normal}
.check input{width:auto}
.buttons{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}
.history-btn{
  padding:3px 8px;
  background:linear-gradient(#fff,#deddd6);
  border:1px solid #7f7f7f;border-top-color:#404040;border-left-color:#404040;
  font:10px Tahoma;cursor:pointer;
}
.history-btn:hover{background:#e8f1ff}
.xpbutton{
  min-width:76px;padding:5px 12px;
  background:linear-gradient(#fff,#ededed);
  border:1px solid #666;border-radius:3px;
  box-shadow:inset 1px 1px #fff;
  font:11px Tahoma;cursor:pointer;
}
.xpbutton:active{border-color:#333;box-shadow:inset 1px 1px 2px #999}
.xpbutton.primary{
  font-weight:bold;
  background:linear-gradient(#fff,#dcecff);
  border-color:#2454a6;
}
.xpbutton:disabled{opacity:.55;cursor:default}

.urlbox{font-family:"Courier New",monospace;font-size:10px}
.preview{
  background:#fff;border:1px solid #7d7d7d;
  min-height:188px;padding:8px;
  box-shadow:inset 1px 1px #ddd;
}
.discord-head{display:flex;gap:7px;align-items:flex-start}
.avatar{
  width:38px;height:38px;border-radius:50%;background:#5865f2;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:bold;
  overflow:hidden;flex:none;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:bold;color:#111}
.bot{
  display:inline-block;margin-left:4px;padding:1px 3px;
  background:#5865f2;color:#fff;font-size:8px;border-radius:2px;
}
.message{margin-top:4px;white-space:pre-wrap;word-break:break-word;line-height:1.4}
.placeholder{color:#999;font-style:italic}

.notice{
  display:none;margin-bottom:7px;padding:7px 9px;
  border:1px solid #c59b00;background:#fff8c9;
}
.notice.show{display:block}
.notice.error{border-color:#a50000;background:#ffe2e2}
.notice.ok{border-color:#4c8c26;background:#e8f6dc}

.log{
  min-height:82px;max-height:140px;overflow:auto;
  background:#fff;border:1px solid #888;
  padding:6px;font-family:"Courier New",monospace;font-size:10px;
}
.history{
  max-height:100px;overflow:auto;
  background:#fff;border:1px solid #888;
  padding:6px;font-family:"Courier New",monospace;font-size:9px;
  margin-top:8px;
}
.history-item{
  padding:3px;border-bottom:1px dotted #ccc;
  cursor:pointer;
}
.history-item:hover{background:#f0f0f0}
.history-item.empty{color:#999;font-style:italic}
.statusbar{
  height:23px;display:flex;align-items:center;gap:3px;
  padding:2px 4px;background:#ece9d8;border-top:1px solid #aaa;
}
.status{
  height:18px;padding:2px 7px;
  border:1px solid #c2c0b6;border-top-color:#858585;border-left-color:#858585;
  background:#f4f2e9;flex:1;
  font-size:10px;
}
.clock{
  padding:2px 8px;
  border:1px solid #c2c0b6;border-top-color:#858585;border-left-color:#858585;
  background:#f4f2e9;
  font-size:10px;
}
</style>
</head>
<body>
<div class="desktop">
<div class="window">
  <div class="titlebar">
    <div class="appicon"></div>
    <div class="title">OctoSender</div>
    <div class="window-controls">
      <button class="wc">_</button><button class="wc">□</button><button class="wc close">×</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool" id="sendToolbar">Send</button>
    <button class="tool" id="previewToolbar">Preview</button>
    <button class="tool" id="clearToolbar">Clear</button>
  </div>

  <div class="main">
    <div id="notice" class="notice"></div>

    <div class="layout">
      <div>
        <fieldset class="group">
          <legend>Webhook</legend>
          <div class="field">
            <label for="webhook">Webhook URL:</label>
            <input id="webhook" class="urlbox" type="password"
              placeholder="https://discord.com/api/webhooks/123.../token">
          </div>
          <div class="field">
            <label for="username">Name:</label>
            <input id="username" maxlength="80" placeholder="Example Bot">
          </div>
          <div class="field">
            <label for="avatarUrl">Avatar URL:</label>
            <input id="avatarUrl" placeholder="https://example.com/avatar.png">
          </div>
          <label class="check"><input id="tts" type="checkbox"> Enable TTS</label>
        </fieldset>

        <fieldset class="group">
          <legend>Delivery</legend>
          <div class="field">
            <label>Mode:</label>
            <select id="deliveryMode">
              <option value="single">Single message</option>
              <option value="spam">Spam</option>
            </select>
          </div>
          <div id="spamOptions" style="display:none">
            <div class="field">
              <label>Spam Type:</label>
              <select id="spamType">
                <option value="rate">Until rate limit</option>
                <option value="count">Specific amount</option>
              </select>
            </div>
            <div class="field" id="countField" style="display:none">
              <label>Amount:</label>
              <input type="number" id="spamCount" min="1" max="100" value="10">
            </div>
            <div class="small">
              <span id="spamWarning" style="color:#c00;display:none">⚠ Spamming may get your webhook banned</span>
            </div>
          </div>
          <div class="small" id="singleInfo">
            Single message mode. Stops on rate limit.
          </div>
        </fieldset>
      </div>

      <div>
        <fieldset class="group">
          <legend>Message</legend>
          <textarea id="message" maxlength="2000" placeholder="Type your message here..."></textarea>
          <div class="small" style="text-align:right;margin-top:3px"><span id="count">0</span> / 2000</div>
          <div class="buttons">
            <button class="xpbutton" id="clearBtn">Clear</button>
            <button class="xpbutton primary" id="sendBtn">Send</button>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>Activity</legend>
          <div id="log" class="log">Ready.</div>
          <div style="margin-top:8px">
            <button class="history-btn" id="clearHistory">Clear History</button>
          </div>
          <div id="history" class="history"></div>
        </fieldset>
      </div>

      <div>
        <fieldset class="group">
          <legend>Preview</legend>
          <div class="preview">
            <div class="discord-head">
              <div class="avatar" id="avatarPreview">XP</div>
              <div style="min-width:0">
                <div class="name" id="namePreview">Example Bot <span class="bot">BOT</span></div>
                <div id="messagePreview" class="message placeholder">Your message will appear here.</div>
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>Status</legend>
          <div class="small">
            Direct browser → Discord connection. No data storage.
          </div>
        </fieldset>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div class="status" id="status">Ready.</div>
    <div class="clock" id="clock">12:00 PM</div>
  </div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const notice=$("notice"),status=$("status"),log=$("log"),sendBtn=$("sendBtn");

function updateClock(){
  const now=new Date();
  let hours=now.getHours();
  const minutes=now.getMinutes().toString().padStart(2,'0');
  const ampm=hours>=12?'PM':'AM';
  hours=hours%12||12;
  $("clock").textContent=hours+':'+minutes+' '+ampm;
}
setInterval(updateClock,1000);
updateClock();

const HISTORY_KEY='octosender_history';
const MAX_HISTORY=10;

function loadHistory(){
  const history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
  const historyDiv=$("history");
  historyDiv.innerHTML='';
  if(history.length===0){
    historyDiv.innerHTML='<div class="history-item empty">No recent messages</div>';
    return;
  }
  history.forEach((msg,i)=>{
    const item=document.createElement('div');
    item.className='history-item';
    item.textContent=msg.substring(0,50)+(msg.length>50?'...':'');
    item.onclick=()=>{
      $("message").value=msg;
      preview();
    };
    historyDiv.appendChild(item);
  });
}
function saveToHistory(msg){
  if(!msg.trim())return;
  let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
  history=history.filter(m=>m!==msg);
  history.unshift(msg);
  if(history.length>MAX_HISTORY)history=history.slice(0,MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
  loadHistory();
}
$("clearHistory").onclick=()=>{
  localStorage.removeItem(HISTORY_KEY);
  loadHistory();
};
loadHistory();

$("deliveryMode").onchange=()=>{
  const mode=$("deliveryMode").value;
  $("spamOptions").style.display=mode==="spam"?"block":"none";
  $("singleInfo").style.display=mode==="single"?"block":"none";
  $("spamWarning").style.display=mode==="spam"?"inline":"none";
};
$("spamType").onchange=()=>{
  const type=$("spamType").value;
  $("countField").style.display=type==="count"?"block":"none";
};

function note(text,type=""){
  notice.textContent=text;
  notice.className="notice show "+type;
}
function preview(){
  const name=$("username").value.trim()||"Example Bot";
  const msg=$("message").value;
  const avatar=$("avatarUrl").value.trim();

  $("namePreview").innerHTML="";
  $("namePreview").append(document.createTextNode(name+" "));
  const bot=document.createElement("span");
  bot.className="bot"; bot.textContent="BOT";
  $("namePreview").appendChild(bot);

  const mp=$("messagePreview");
  mp.textContent=msg||"Your message will appear here.";
  mp.className=msg?"message":"message placeholder";
  $("count").textContent=msg.length;

  const av=$("avatarPreview"); av.innerHTML="";
  if(avatar){
    const img=document.createElement("img");
    img.src=avatar; img.alt="";
    img.onerror=()=>av.textContent="XP";
    av.appendChild(img);
  }else av.textContent=name.slice(0,2).toUpperCase();
}
["username","avatarUrl","message"].forEach(id=>$(id).addEventListener("input",preview));

$("clearBtn").onclick=()=>{
  $("message").value=""; preview(); note("Message cleared.","ok"); status.textContent="Ready.";
};
$("clearToolbar").onclick=()=>$("clearBtn").click();
$("previewToolbar").onclick=()=>{preview();note("Preview updated.","ok")};
$("sendToolbar").onclick=()=>$("sendBtn").click();

function validWebhook(url){
  try{
    const u=new URL(url);
    return u.protocol==="https:" &&
      (u.hostname==="discord.com"||u.hostname==="discordapp.com") &&
      /\/api\/webhooks\/\d+\/[^/]+/.test(u.pathname);
  }catch{return false}
}
async function send(){
  const webhook=$("webhook").value.trim();
  const content=$("message").value;
  if(!validWebhook(webhook)){
    note("Enter a valid Discord webhook URL from a webhook you control.","error"); return;
  }
  if(!content.trim()){
    note("Enter a message first.","error"); return;
  }

  const mode=$("deliveryMode").value;
  const payload={content,tts:$("tts").checked};
  const username=$("username").value.trim(), avatar=$("avatarUrl").value.trim();
  if(username)payload.username=username;
  if(avatar)payload.avatar_url=avatar;

  if(mode==="single"){
    sendBtn.disabled=true; status.textContent="Sending...";
    note("Sending message...");

    try{
      const r=await fetch(webhook,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });

      if(r.status===429){
        let retry=Number(r.headers.get("Retry-After")||0);
        if(retry>100)retry=Math.ceil(retry/1000); else retry=Math.ceil(retry);
        try{
          const d=await r.json();
          if(d.retry_after)retry=Math.ceil(Number(d.retry_after));
        }catch{}
        const text=retry?
          `Discord rate limit is active. Wait about ${retry} second${retry===1?"":"s"} before sending again.`:
          "Discord rate limit is active. Please wait before sending again.";
        note(text,"error");status.textContent="Rate limited.";log.textContent=text;return;
      }
      if(!r.ok){
        note("Discord returned HTTP "+r.status+". Check the webhook URL.","error");
        status.textContent="Send failed.";log.textContent="HTTP "+r.status;return;
      }
      note("Message sent successfully.","ok");
      status.textContent="Message sent.";
      log.textContent="["+new Date().toLocaleTimeString()+"] Message sent successfully.";
      saveToHistory(content);
    }catch(e){
      note("The request could not be completed. A browser/network restriction may be blocking the request.","error");
      status.textContent="Connection error.";
      log.textContent=e.message||"Network error";
    }finally{sendBtn.disabled=false}
  }else{
    const spamType=$("spamType").value;
    let count=spamType==="count"?parseInt($("spamCount").value)||10:999;
    let sent=0,failed=0;

    sendBtn.disabled=true;
    note(`Starting spam mode (${spamType==="rate"?"until rate limit":count+" messages"})...`);
    status.textContent="Spamming...";

    for(let i=0;i<count;i++){
      if(spamType==="rate"&&failed>0)break;

      try{
        const r=await fetch(webhook,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });

        if(r.status===429){
          const text="Rate limit hit. Stopping spam.";
          note(text,"error");
          status.textContent="Rate limited.";
          log.textContent="["+new Date().toLocaleTimeString()+"] "+text;
          break;
        }
        if(!r.ok){
          failed++;
          log.textContent="["+new Date().toLocaleTimeString()+"] HTTP "+r.status;
          continue;
        }
        sent++;
        status.textContent=`Sent ${sent} message${sent===1?"":"s"}...`;
        log.textContent="["+new Date().toLocaleTimeString()+"] Sent message "+(i+1);
        await new Promise(r=>setTimeout(r,500));
      }catch(e){
        failed++;
        log.textContent="["+new Date().toLocaleTimeString()+"] Network error";
      }
    }

    note(`Spam complete. Sent: ${sent}, Failed: ${failed}`,"ok");
    status.textContent="Done.";
    if(sent>0)saveToHistory(content);
    sendBtn.disabled=false;
  }
}
$("sendBtn").onclick=send;
preview();
</script>
</body>
</html>
